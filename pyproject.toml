[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agriscan"
version = "0.1.0"
description = "Re-implementation of the AgriScan vision and web pipeline (PyTorch)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy",
    "pillow",
    "pandas",
    "matplotlib",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]
app = ["fastapi", "uvicorn", "python-multipart", "httpx"]
detect = ["ultralytics"]  # AGPL-3.0; also pulls opencv for video I/O

[tool.setuptools.packages.find]
where = ["src"]
